<!DOCTYPE html>
<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Campus Puzzle</title>


	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="popup.css">


	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

	<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

	<body>

		<!-- START SCREEN -->
		<section id="startScreen" class="screen">

			<h1>Campus Puzzle</h1>

			<button id="startButton">
				START
			</button>

		</section>


		<!-- MAIN GAME -->
		<section id="gameScreen" class="screen hidden">

			<!-- Top left button -->
			<button id="leftButton" class="topButton">
				MENU
			</button>


			<!-- Top right button -->
			<button id="rightButton" class="topButton">
				?
			</button>


			<!-- Three rectangles -->
			<div id="puzzleArea">

				<div class="codeSlot" id="code1">
					????????
				</div>

				<div class="codeSlot" id="code2">
					????????
				</div>

				<div class="codeSlot" id="code3">
					????????
				</div>

			</div>


			<!--   QR button    -->
			<button id="qrButton">
				SCAN QR
			</button>

		</section>
		<!--  POP UP         -->
		<div id="popupOverlay" class="popupHidden">

			<div id="popup">

				<p id="popupText"></p>

				<img id="popupImage" src="" alt="Popup image">

				<div id="qrPopupContent">

					<div id="qrReader"></div>

				</div>
				<button id="popupClose">X</button>

			</div>

		</div>
		<!-- LIBRARY -->
		<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

		<!-- SCRIPTS -->
		<script src="Scripts/popup.js"></script>

		<script src="Scripts/main.js"></script>
		<script src="Scripts/menu.js"></script>
		<script src="Scripts/game.js"></script>
		<script src="Scripts/qr.js"></script>



	</body>

</html>
