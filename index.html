<!DOCTYPE html>
<html>

<head>
	<title>Campus Puzzle</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>

	<div class="game">

		<h1>🧩 Campus Puzzle</h1>

		<p>Find all 6 pieces!</p>

		<!-- Puzzle -->
		<div id="puzzle">

			<div class="piece piece1">?</div>
			<div class="piece piece2">?</div>
			<div class="piece piece3">?</div>

			<div class="piece piece4">?</div>
			<div class="piece piece5">?</div>
			<div class="piece piece6">?</div>

		</div>

		<p id="counter">0 / 6 pieces found</p>

		<!-- QR Scanner -->
		<div id="scanner">
			<div id="reader"></div>
		</div>

		<p id="result"></p>

		<button id="scanButton">📷 Scan QR Code</button>

	</div>

	<!-- QR Code Library -->
	<script src="https://unpkg.com/html5-qrcode"></script>

	<!-- Our JavaScript -->
	<script src="script.js"></script>

</body>

</html>
